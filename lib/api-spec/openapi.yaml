openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: SOC OS - SaaS Security Platform API (V30/V50)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Security event operations
  - name: simulation
    description: Self-healing simulation
  - name: dashboard
    description: Dashboard and analytics
  - name: tenants
    description: Multi-tenant management
  - name: rules
    description: Rules engine management
  - name: correlations
    description: Attack chain correlations
  - name: runtime
    description: META-CUBE execution runtime
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List security events
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: tactic
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of security events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
    post:
      operationId: processEvent
      tags: [events]
      summary: Process a security event through the full SOC pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Pipeline result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineResult"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single security event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Security event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
        "404":
          description: Not found

  /events/{id}/status:
    patch:
      operationId: updateEventStatus
      tags: [events]
      summary: Update alert lifecycle status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventStatusBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
        "404":
          description: Not found

  /self-test:
    post:
      operationId: runSelfTest
      tags: [simulation]
      summary: Run self red-team test
      responses:
        "200":
          description: Self-test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfTestResult"

  /simulate:
    post:
      operationId: runSimulation
      tags: [simulation]
      summary: Run full self-healing simulation
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"

  /patches:
    get:
      operationId: listPatches
      tags: [events]
      summary: List all auto-applied patches
      responses:
        "200":
          description: List of patches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patch"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /threat-graph:
    get:
      operationId: getThreatGraph
      tags: [dashboard]
      summary: Get threat graph
      responses:
        "200":
          description: Threat graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatGraph"

  /system-metrics:
    get:
      operationId: getSystemMetrics
      tags: [dashboard]
      summary: Get real-time server system metrics
      responses:
        "200":
          description: System metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetrics"

  /mitre-stats:
    get:
      operationId: getMitreStats
      tags: [dashboard]
      summary: Get MITRE ATT&CK tactic breakdown
      responses:
        "200":
          description: MITRE stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MitreStat"

  /risk-timeline:
    get:
      operationId: getRiskTimeline
      tags: [dashboard]
      summary: Get risk score over time (last 24h)
      responses:
        "200":
          description: Risk timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskTimelinePoint"

  /queue-stats:
    get:
      operationId: getQueueStats
      tags: [dashboard]
      summary: Get ingest queue statistics
      responses:
        "200":
          description: Queue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStats"

  # ─── META-CUBE RUNTIME ─────────────────────────────────────────────────────
  /meta-cube/health:
    get:
      operationId: getMetaCubeHealth
      tags: [runtime]
      summary: Get META-CUBE execution service health
      responses:
        "200":
          description: META-CUBE health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeHealth"
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions:
    get:
      operationId: listMetaCubeExecutions
      tags: [runtime]
      summary: List META-CUBE executions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed, retrying, dead_letter, recovered]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: META-CUBE executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetaCubeExecution"
        "503":
          description: META-CUBE unavailable
    post:
      operationId: createMetaCubeExecution
      tags: [runtime]
      summary: Submit a META-CUBE execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaCubeExecutionInput"
      responses:
        "202":
          description: Execution accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "400":
          description: Invalid execution
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions/{id}:
    get:
      operationId: getMetaCubeExecution
      tags: [runtime]
      summary: Get a META-CUBE execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: META-CUBE execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "404":
          description: Execution not found
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions/{id}/retry:
    post:
      operationId: retryMetaCubeExecution
      tags: [runtime]
      summary: Retry a failed META-CUBE execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "404":
          description: Execution not found
        "409":
          description: Execution cannot be retried
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions/{id}/recover:
    post:
      operationId: recoverMetaCubeExecution
      tags: [runtime]
      summary: Recover a META-CUBE execution from its checkpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Recovery accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "404":
          description: Execution not found
        "409":
          description: Execution has no recoverable checkpoint
        "503":
          description: META-CUBE unavailable

  /meta-cube/dlq:
    get:
      operationId: listMetaCubeDlq
      tags: [runtime]
      summary: List META-CUBE dead-letter executions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Dead-letter executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetaCubeExecution"
        "503":
          description: META-CUBE unavailable

  /meta-cube/checkpoints:
    get:
      operationId: listMetaCubeCheckpoints
      tags: [runtime]
      summary: List META-CUBE checkpoints
      parameters:
        - name: executionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Runtime checkpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetaCubeCheckpoint"
        "503":
          description: META-CUBE unavailable

  # ─── TENANTS ──────────────────────────────────────────────────────────────
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantBody"
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── RULES ────────────────────────────────────────────────────────────────
  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List detection rules
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
    post:
      operationId: createRule
      tags: [rules]
      summary: Create a new detection rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleBody"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"

  /rules/{id}:
    patch:
      operationId: updateRule
      tags: [rules]
      summary: Update a detection rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleBody"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          description: Not found
    delete:
      operationId: deleteRule
      tags: [rules]
      summary: Delete a detection rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /rules/{id}/toggle:
    patch:
      operationId: toggleRule
      tags: [rules]
      summary: Enable or disable a rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleRuleBody"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"

  # ─── CORRELATIONS ─────────────────────────────────────────────────────────
  /correlations:
    get:
      operationId: listCorrelations
      tags: [correlations]
      summary: List detected attack chain correlations
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: severity
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of correlations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Correlation"

  /correlations/{id}/resolve:
    patch:
      operationId: resolveCorrelation
      tags: [correlations]
      summary: Mark a correlation as resolved
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved correlation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Correlation"
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SecurityEvent:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        event:
          type: string
        score:
          type: integer
        action:
          type: string
          enum: [ALLOW, WARN, ISOLATE, PATCHED]
        status:
          type: string
          enum: [NEW, ACKNOWLEDGED, INVESTIGATING, RESOLVED]
        tactic:
          type: ["string", "null"]
        technique:
          type: ["string", "null"]
        techniqueId:
          type: ["string", "null"]
        velocityFlag:
          type: boolean
        correlationId:
          type: ["integer", "null"]
        nodeId:
          type: string
        hash:
          type: string
        prevHash:
          type: string
        timestamp:
          type: string
          format: date-time
        cpuUsage:
          type: ["integer", "null"]
        memUsage:
          type: ["integer", "null"]
      required:
        - id
        - event
        - score
        - action
        - status
        - velocityFlag
        - nodeId
        - hash
        - prevHash
        - timestamp

    EventInput:
      type: object
      properties:
        event:
          type: string
          minLength: 1
        tenantId:
          type: ["integer", "null"]
        cpuUsage:
          type: ["integer", "null"]
        memUsage:
          type: ["integer", "null"]
      required: [event]

    PipelineResult:
      type: object
      properties:
        event:
          $ref: "#/components/schemas/SecurityEvent"
        rulesMatched:
          type: integer
        scoreBoost:
          type: integer
        correlation:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/Correlation"
            - type: "null"
        pipelineStages:
          type: array
          items:
            type: string
      required: [event, rulesMatched, scoreBoost, pipelineStages]

    UpdateEventStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [ACKNOWLEDGED, INVESTIGATING, RESOLVED]
      required: [status]

    Patch:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        attack:
          type: string
        fix:
          type: string
        tactic:
          type: ["string", "null"]
        appliedAt:
          type: string
          format: date-time
      required: [id, attack, fix, appliedAt]

    SelfTestResult:
      type: object
      properties:
        vulnerabilities:
          type: array
          items:
            type: object
            properties:
              attack:
                type: string
              score:
                type: integer
              action:
                type: string
              tactic:
                type: ["string", "null"]
              technique:
                type: ["string", "null"]
              fix:
                type: ["string", "null"]
            required: [attack, score, action]
        patchesApplied:
          type: integer
        systemStatus:
          type: string
      required: [vulnerabilities, patchesApplied, systemStatus]

    SimulationResult:
      type: object
      properties:
        baseEvent:
          $ref: "#/components/schemas/SecurityEvent"
        selfHealingEvents:
          type: array
          items:
            type: object
            properties:
              attack:
                type: string
              tactic:
                type: ["string", "null"]
              fix:
                type: string
            required: [attack, fix]
        totalProcessed:
          type: integer
        patchesApplied:
          type: integer
      required: [baseEvent, selfHealingEvents, totalProcessed, patchesApplied]

    DashboardSummary:
      type: object
      properties:
        totalEvents:
          type: integer
        totalPatches:
          type: integer
        totalCorrelations:
          type: integer
        openAlerts:
          type: integer
        resolvedAlerts:
          type: integer
        actionCounts:
          type: object
          properties:
            ALLOW:
              type: integer
            WARN:
              type: integer
            ISOLATE:
              type: integer
            PATCHED:
              type: integer
          required: [ALLOW, WARN, ISOLATE, PATCHED]
        statusCounts:
          type: object
          properties:
            NEW:
              type: integer
            ACKNOWLEDGED:
              type: integer
            INVESTIGATING:
              type: integer
            RESOLVED:
              type: integer
          required: [NEW, ACKNOWLEDGED, INVESTIGATING, RESOLVED]
        systemStatus:
          type: string
          enum: [SECURE, MONITORING, ALERT, CRITICAL]
        avgRiskScore:
          type: number
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEvent"
        threatLevel:
          type: integer
        topTactics:
          type: array
          items:
            type: object
            properties:
              tactic:
                type: string
              count:
                type: integer
            required: [tactic, count]
      required:
        - totalEvents
        - totalPatches
        - totalCorrelations
        - openAlerts
        - resolvedAlerts
        - actionCounts
        - statusCounts
        - systemStatus
        - avgRiskScore
        - recentEvents
        - threatLevel
        - topTactics

    ThreatNode:
      type: object
      properties:
        id:
          type: string
        event:
          type: string
        score:
          type: integer
        action:
          type: string
        tactic:
          type: ["string", "null"]
        status:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [id, event, score, action, status, timestamp]

    ThreatGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ThreatNode"
        edges:
          type: array
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
      required: [nodes, edges]

    SystemMetrics:
      type: object
      properties:
        cpuPercent:
          type: number
        memPercent:
          type: number
        memUsedMb:
          type: number
        memTotalMb:
          type: number
        loadAvg1m:
          type: number
        loadAvg5m:
          type: number
        loadAvg15m:
          type: number
        uptimeSeconds:
          type: number
      required: [cpuPercent, memPercent, memUsedMb, memTotalMb, loadAvg1m, loadAvg5m, loadAvg15m, uptimeSeconds]

    MitreStat:
      type: object
      properties:
        tactic:
          type: string
        count:
          type: integer
        avgScore:
          type: number
      required: [tactic, count, avgScore]

    RiskTimelinePoint:
      type: object
      properties:
        hour:
          type: string
          format: date-time
        avgScore:
          type: number
        count:
          type: integer
      required: [hour, avgScore, count]

    QueueStats:
      type: object
      properties:
        pending:
          type: integer
        maxSize:
          type: integer
        hasProcessor:
          type: boolean
        isProcessing:
          type: boolean
      required: [pending, maxSize, hasProcessor, isProcessing]

    Tenant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        apiKey:
          type: string
        plan:
          type: string
          enum: [starter, pro, enterprise]
        createdAt:
          type: string
          format: date-time
        eventCount:
          type: integer
      required: [id, name, apiKey, plan, createdAt]

    CreateTenantBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        plan:
          type: string
          enum: [starter, pro, enterprise]
      required: [name]

    Rule:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        matchPattern:
          type: string
        scoreBoost:
          type: integer
        forceAction:
          type: ["string", "null"]
          enum: [WARN, ISOLATE, null]
        severity:
          type: string
          enum: [low, medium, high, critical]
        enabled:
          type: boolean
        hitCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, matchPattern, scoreBoost, severity, enabled, hitCount, createdAt]

    CreateRuleBody:
      type: object
      properties:
        tenantId:
          type: ["integer", "null"]
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        matchPattern:
          type: string
          minLength: 1
        scoreBoost:
          type: integer
          minimum: 0
          maximum: 20
        forceAction:
          type: ["string", "null"]
          enum: [WARN, ISOLATE, null]
        severity:
          type: string
          enum: [low, medium, high, critical]
        enabled:
          type: boolean
      required: [name, matchPattern, scoreBoost, severity]

    UpdateRuleBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        matchPattern:
          type: string
        scoreBoost:
          type: integer
        forceAction:
          type: ["string", "null"]
        severity:
          type: string
        enabled:
          type: boolean

    ToggleRuleBody:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]

    Correlation:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        threatType:
          type: string
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        confidence:
          type: number
        summary:
          type: string
        eventIds:
          type: string
        resolvedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, threatType, severity, confidence, summary, eventIds, createdAt]

    MetaCubeHealth:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        persistence:
          type: string
          enum: [local, postgres, redis]
        worker:
