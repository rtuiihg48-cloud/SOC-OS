        resourceKey:
          type: string
        location:
          type: string
        state:
          type: object
          additionalProperties: true
        stateHash:
          type: string
        status:
          type: string
          enum: [VERIFIED, USED, REJECTED]
        source:
          type: string
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
      required: [id, resourceKey, location, state, stateHash, status, source, createdAt, verifiedAt]

    SelfHealingAction:
