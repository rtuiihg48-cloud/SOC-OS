openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: SOC OS - SaaS Security Platform API (V30/V50)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Security event operations
  - name: simulation
    description: Self-healing simulation
  - name: dashboard
    description: Dashboard and analytics
  - name: tenants
    description: Multi-tenant management
  - name: rules
    description: Rules engine management
  - name: correlations
    description: Attack chain correlations
  - name: runtime
    description: META-CUBE execution runtime
  - name: agent
    description: Observer-only agent analysis
  - name: boot
    description: HCK-BIOS runtime diagnostics
  - name: quarantine
    description: Logical sandbox quarantine captures
  - name: self-healing
    description: Verified restore points for managed logical resources
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /agent/observe:
    post:
      operationId: runObserverAgent
      tags: [agent]
      summary: Run a policy-gated observer-only analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObserverAgentInput"
      responses:
        "200":
          description: Observer analysis completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserverAgentRun"
        "400":
          description: Invalid observer request
        "403":
          description: Policy blocked the requested action

  /boot/status:
    get:
      operationId: getBootStatus
      tags: [boot]
      summary: Get HCK-BIOS boot and runtime diagnostics
      responses:
        "200":
          description: Boot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HckBiosStatus"
        "503":
          description: Boot failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HckBiosStatus"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List security events
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: tactic
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of security events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
    post:
      operationId: processEvent
      tags: [events]
      summary: Process a security event through the full SOC pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Pipeline result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineResult"

  /quarantine:
    get:
      operationId: listQuarantineCaptures
      tags: [quarantine]
      summary: List logical sandbox quarantine captures
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [QUARANTINED, RELEASED, DISCARDED]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Quarantine captures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxQuarantine"

  /quarantine/{id}:
    get:
      operationId: getQuarantineCapture
      tags: [quarantine]
      summary: Get one logical sandbox quarantine capture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quarantine capture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxQuarantine"
        "404":
          description: Quarantine capture not found

  /self-healing/resources:
    get:
      operationId: listManagedResources
      tags: [self-healing]
      summary: List resources governed by the self-healing boundary
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Managed resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedResource"
    post:
      operationId: registerManagedResource
      tags: [self-healing]
      summary: Register a verified managed resource and create a restore point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterManagedResourceInput"
      responses:
        "201":
          description: Resource and verified restore point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterManagedResourceResult"
        "400":
          description: Invalid or oversized resource state

  /self-healing/restore-points:
    get:
      operationId: listRestorePoints
      tags: [self-healing]
      summary: List immutable verified restore points
      parameters:
        - name: resourceKey
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Restore points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelfHealingRestorePoint"

  /self-healing/actions:
    get:
      operationId: listSelfHealingActions
      tags: [self-healing]
      summary: List self-healing audit actions
      parameters:
        - name: resourceKey
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Self-healing actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelfHealingAction"

  /self-healing/restore-points/{id}/preview:
    post:
      operationId: previewRestorePoint
      tags: [self-healing]
      summary: Verify that a restore point can safely return to its original location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restore preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePreview"
        "404":
          description: Restore point or managed resource not found
        "409":
          description: Restore point failed integrity or location verification

  /self-healing/restore-points/{id}/apply:
    post:
      operationId: applyRestorePoint
      tags: [self-healing]
      summary: Atomically restore a verified point to the same managed location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: integer
      responses:
        "200":
          description: Verified restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "404":
          description: Restore point or managed resource not found
        "409":
          description: Restore point failed integrity or location verification

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single security event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Security event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
        "404":
          description: Not found

  /events/{id}/status:
    patch:
      operationId: updateEventStatus
      tags: [events]
      summary: Update alert lifecycle status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventStatusBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
        "404":
          description: Not found

  /self-test:
    post:
      operationId: runSelfTest
      tags: [simulation]
      summary: Run self red-team test
      responses:
        "200":
          description: Self-test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfTestResult"

  /simulate:
    post:
      operationId: runSimulation
      tags: [simulation]
      summary: Run full self-healing simulation
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"

  /voice/transcribe:
    post:
      operationId: transcribeVoice
      tags: [voice]
      summary: Transcribe an audio command without storing the audio
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
          audio/webm:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
          audio/mpeg:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Transcribed voice input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceTranscription"
        "400":
          description: Audio payload is missing
        "415":
          description: Unsupported audio format
        "502":
          description: Transcription provider unavailable

  /patches:
    get:
      operationId: listPatches
      tags: [events]
      summary: List all auto-applied patches
      responses:
        "200":
          description: List of patches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patch"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /threat-graph:
    get:
      operationId: getThreatGraph
      tags: [dashboard]
      summary: Get threat graph
      responses:
        "200":
          description: Threat graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatGraph"

  /system-metrics:
    get:
      operationId: getSystemMetrics
      tags: [dashboard]
      summary: Get real-time server system metrics
      responses:
        "200":
          description: System metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetrics"

  /mitre-stats:
    get:
      operationId: getMitreStats
      tags: [dashboard]
      summary: Get MITRE ATT&CK tactic breakdown
      responses:
        "200":
          description: MITRE stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MitreStat"

  /risk-timeline:
    get:
      operationId: getRiskTimeline
      tags: [dashboard]
      summary: Get risk score over time (last 24h)
      responses:
        "200":
          description: Risk timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskTimelinePoint"

  /queue-stats:
    get:
      operationId: getQueueStats
      tags: [dashboard]
      summary: Get ingest queue statistics
      responses:
        "200":
          description: Queue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStats"

  # ─── META-CUBE RUNTIME ─────────────────────────────────────────────────────
  /meta-cube/health:
    get:
      operationId: getMetaCubeHealth
      tags: [runtime]
      summary: Get META-CUBE execution service health
      responses:
        "200":
          description: META-CUBE health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeHealth"
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions:
    get:
      operationId: listMetaCubeExecutions
      tags: [runtime]
      summary: List META-CUBE executions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed, retrying, dead_letter, recovered]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: META-CUBE executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetaCubeExecution"
        "503":
          description: META-CUBE unavailable
    post:
      operationId: createMetaCubeExecution
      tags: [runtime]
      summary: Submit a META-CUBE execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaCubeExecutionInput"
      responses:
        "202":
          description: Execution accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "400":
          description: Invalid execution
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions/{id}:
    get:
      operationId: getMetaCubeExecution
      tags: [runtime]
      summary: Get a META-CUBE execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: META-CUBE execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "404":
          description: Execution not found
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions/{id}/retry:
    post:
      operationId: retryMetaCubeExecution
      tags: [runtime]
      summary: Retry a failed META-CUBE execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "404":
          description: Execution not found
        "409":
          description: Execution cannot be retried
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions/{id}/recover:
    post:
      operationId: recoverMetaCubeExecution
      tags: [runtime]
      summary: Recover a META-CUBE execution from its checkpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Recovery accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "404":
          description: Execution not found
        "409":
          description: Execution has no recoverable checkpoint
        "503":
          description: META-CUBE unavailable

  /meta-cube/dlq:
    get:
      operationId: listMetaCubeDlq
      tags: [runtime]
      summary: List META-CUBE dead-letter executions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Dead-letter executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetaCubeExecution"
        "503":
          description: META-CUBE unavailable

  /meta-cube/checkpoints:
    get:
      operationId: listMetaCubeCheckpoints
      tags: [runtime]
      summary: List META-CUBE checkpoints
      parameters:
        - name: executionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Runtime checkpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetaCubeCheckpoint"
        "503":
          description: META-CUBE unavailable

  # ─── TENANTS ──────────────────────────────────────────────────────────────
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantBody"
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── RULES ────────────────────────────────────────────────────────────────
  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List detection rules
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
    post:
      operationId: createRule
      tags: [rules]
      summary: Create a new detection rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleBody"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"

  /rules/{id}:
    patch:
      operationId: updateRule
      tags: [rules]
      summary: Update a detection rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleBody"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          description: Not found
    delete:
      operationId: deleteRule
      tags: [rules]
      summary: Delete a detection rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /rules/{id}/toggle:
    patch:
      operationId: toggleRule
      tags: [rules]
      summary: Enable or disable a rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleRuleBody"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"

  # ─── CORRELATIONS ─────────────────────────────────────────────────────────
  /correlations:
    get:
      operationId: listCorrelations
      tags: [correlations]
      summary: List detected attack chain correlations
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: severity
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of correlations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Correlation"

  /correlations/{id}/resolve:
    patch:
      operationId: resolveCorrelation
      tags: [correlations]
      summary: Mark a correlation as resolved
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved correlation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Correlation"
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ObserverAgentInput:
      type: object
      properties:
        taskType:
          type: string
          enum: [analyze_event, analyze_system, inspect_memory]
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
        event:
          type: string
          maxLength: 10000
        tenantId:
          type: integer
          minimum: 1
      required: [taskType, instruction]

    ObserverAgentRun:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum: [blocked, completed, failed]
        input:
          $ref: "#/components/schemas/ObserverAgentInput"
        policy:
          type: object
          additionalProperties: true
        plan:
          type: array
          items:
            type: object
            additionalProperties: true
        results:
          type: array
          items:
            type: object
            additionalProperties: true
        reflection:
          type: object
          additionalProperties: true
        productionChanged:
          type: boolean
          enum: [false]
      required: [runId, status, input, policy, plan, results, reflection, productionChanged]

    HckBiosStatus:
      type: object
      properties:
        name:
          type: string
          enum: [HCK-BIOS]
        modelVersion:
          type: string
          enum: [hck-bios-v1]
        status:
          type: string
          enum: [offline, booting, ready, degraded, failed]
        bootedAt:
          type: ["string", "null"]
          format: date-time
        productionMutationsAllowed:
          type: boolean
          enum: [false]
        executionPlane:
          type: string
          enum: [isolated]
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: true
        topology:
          type: object
          additionalProperties: true
        stages:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [name, modelVersion, status, bootedAt, productionMutationsAllowed, executionPlane, capabilities, topology, stages]

    VoiceTranscription:
      type: object
      properties:
        transcript:
          type: string
        format:
          type: string
          enum: [wav, mp3]
        audioStored:
          type: boolean
          enum: [false]
      required: [transcript, format, audioStored]

    SecurityEvent:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        event:
          type: string
        score:
          type: integer
        action:
          type: string
          enum: [ALLOW, WARN, ISOLATE, PATCHED]
        status:
          type: string
          enum: [NEW, ACKNOWLEDGED, INVESTIGATING, QUARANTINED, RESOLVED]
        tactic:
          type: ["string", "null"]
        technique:
          type: ["string", "null"]
        techniqueId:
          type: ["string", "null"]
        velocityFlag:
          type: boolean
        correlationId:
          type: ["integer", "null"]
        nodeId:
          type: string
        hash:
          type: string
        prevHash:
          type: string
        timestamp:
          type: string
          format: date-time
        cpuUsage:
          type: ["integer", "null"]
        memUsage:
          type: ["integer", "null"]
      required:
        - id
        - event
        - score
        - action
        - status
        - velocityFlag
        - nodeId
        - hash
        - prevHash
        - timestamp

    EventInput:
      type: object
      properties:
        event:
          type: string
          minLength: 1
