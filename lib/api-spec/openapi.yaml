          nullable: true
          oneOf:
            - $ref: "#/components/schemas/Correlation"
            - type: "null"
        pipelineStages:
          type: array
          items:
            type: string
        selfHealing:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/SelfHealingAction"
            - type: "null"
      required: [event, rulesMatched, scoreBoost, pipelineStages]

    SandboxQuarantine:
      type: object
      properties:
