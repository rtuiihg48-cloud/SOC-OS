          type: ["integer", "null"]
        cpuUsage:
          type: ["integer", "null"]
        memUsage:
          type: ["integer", "null"]
        managedResourceKey:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$"
        observedManagedState:
          type: object
          additionalProperties: true
      required: [event]

    PipelineResult:
      type: object
      properties:
        event:
          $ref: "#/components/schemas/SecurityEvent"
