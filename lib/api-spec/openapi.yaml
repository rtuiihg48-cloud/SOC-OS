          type: ["string", "null"]
        restoredStateHash:
          type: ["string", "null"]
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, resourceKey, location, mode, status, message, createdAt]

    RestorePreview:
