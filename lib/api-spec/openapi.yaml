openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.3.0
  description: SOC OS - SaaS Security Platform API (V30/V50)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Security event operations
  - name: simulation
    description: Self-healing simulation
  - name: dashboard
    description: Dashboard and analytics
  - name: tenants
    description: Multi-tenant management
  - name: rules
    description: Rules engine management
  - name: correlations
    description: Attack chain correlations
  - name: runtime
    description: META-CUBE execution runtime
  - name: agent
    description: Observer-only agent analysis
  - name: boot
    description: HCK-BIOS runtime diagnostics
  - name: quarantine
    description: Logical sandbox quarantine captures
  - name: self-healing
    description: Verified restore points for managed logical resources
  - name: virus-database
    description: Virus intelligence catalog and private sample metadata
  - name: traffic
    description: Normalized Node Gateway traffic telemetry and deterministic analysis
paths:
  /auth/me:
    get:
      operationId: getCurrentPrincipal
      tags: [auth]
      summary: Get the authenticated normalized principal
      responses:
        "200":
          description: Current principal
          content: { application/json: { schema: { $ref: "#/components/schemas/CurrentPrincipal" } } }
        "401": { description: Authentication required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /audit/records:
    get:
      operationId: listAuditRecords
      tags: [audit]
      summary: List tenant-scoped immutable audit evidence
      parameters:
        - { name: tenantId, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Stable audit record page
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditRecordPage" } } }
  /audit/verify:
    post:
      operationId: verifyAuditChain
      tags: [audit]
      summary: Read-only verification of a tenant audit chain range
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AuditVerificationInput" } } }
      responses:
        "200":
          description: Chain verification result
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditVerificationResult" } } }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /agent/observe:
    post:
      operationId: runObserverAgent
      tags: [agent]
      summary: Run a policy-gated observer-only analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObserverAgentInput"
      responses:
        "200":
          description: Observer analysis completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObserverAgentRun"
        "400":
          description: Invalid observer request
        "403":
          description: Policy blocked the requested action

  /boot/status:
    get:
      operationId: getBootStatus
      tags: [boot]
      summary: Get HCK-BIOS boot and runtime diagnostics
      responses:
        "200":
          description: Boot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HckBiosStatus"
        "503":
          description: Boot failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HckBiosStatus"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List security events
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: tactic
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of security events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
    post:
      operationId: processEvent
      tags: [events]
      summary: Process a security event through the full SOC pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Pipeline result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineResult"

  /quarantine:
    get:
      operationId: listQuarantineCaptures
      tags: [quarantine]
      summary: List logical sandbox quarantine captures
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [QUARANTINED, RELEASED, DISCARDED]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Quarantine captures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SandboxQuarantine"

  /quarantine/{id}:
    get:
      operationId: getQuarantineCapture
      tags: [quarantine]
      summary: Get one logical sandbox quarantine capture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quarantine capture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxQuarantine"
        "404":
          description: Quarantine capture not found

  /self-healing/resources:
    get:
      operationId: listManagedResources
      tags: [self-healing]
      summary: List resources governed by the self-healing boundary
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Managed resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManagedResource"
    post:
      operationId: registerManagedResource
      tags: [self-healing]
      summary: Register a verified managed resource and create a restore point
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterManagedResourceInput"
      responses:
        "201":
          description: Resource and verified restore point
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterManagedResourceResult"
        "400":
          description: Invalid or oversized resource state

  /self-healing/restore-points:
    get:
      operationId: listRestorePoints
      tags: [self-healing]
      summary: List immutable verified restore points
      parameters:
        - name: resourceKey
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Restore points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelfHealingRestorePoint"

  /self-healing/actions:
    get:
      operationId: listSelfHealingActions
      tags: [self-healing]
      summary: List self-healing audit actions
      parameters:
        - name: resourceKey
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Self-healing actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelfHealingAction"

  /self-healing/restore-points/{id}/preview:
    post:
      operationId: previewRestorePoint
      tags: [self-healing]
      summary: Verify that a restore point can safely return to its original location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restore preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePreview"
        "404":
          description: Restore point or managed resource not found
        "409":
          description: Restore point failed integrity or location verification

  /self-healing/restore-points/{id}/apply:
    post:
      operationId: applyRestorePoint
      tags: [self-healing]
      summary: Atomically restore a verified point to the same managed location
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: integer
      responses:
        "200":
          description: Verified restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "404":
          description: Restore point or managed resource not found
        "409":
          description: Restore point failed integrity or location verification

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single security event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Security event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
        "404":
          description: Not found

  /events/{id}/status:
    patch:
      operationId: updateEventStatus
      tags: [events]
      summary: Update alert lifecycle status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventStatusBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
        "404":
          description: Not found

  /traffic/telemetry:
    post:
      operationId: ingestTrafficTelemetry
      tags: [traffic]
      summary: Ingest a normalized Node Gateway heartbeat or flow summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrafficTelemetryInput"
      responses:
        "201":
          description: Stored and analyzed traffic observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficObservation"
        "400":
          description: Invalid or unsafe telemetry
        "409":
          description: Observation already exists for this gateway

  /traffic/flows:
    get:
      operationId: listTrafficFlows
      tags: [traffic]
      summary: List analyzed Node Gateway flow summaries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: protocol
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
            enum: [ALLOW, WARN, ISOLATE]
        - name: severity
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - name: direction
          in: query
          schema:
            type: string
            enum: [INBOUND, OUTBOUND, INTERNAL, UNKNOWN]
        - name: observationType
          in: query
          schema:
            type: string
            enum: [FLOW, HEARTBEAT]
        - name: gatewayId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Analyzed traffic observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrafficObservation"

  /traffic/summary:
    get:
      operationId: getTrafficSummary
      tags: [traffic]
      summary: Get traffic risk and gateway health summary
      responses:
        "200":
          description: Traffic analysis summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficSummary"

  /traffic/synthetic:
    post:
      operationId: generateSyntheticTraffic
      tags: [traffic]
      summary: Generate harmless synthetic flow summaries for analysis validation
      responses:
        "201":
          description: Synthetic observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrafficObservation"

  /self-test:
    post:
      operationId: runSelfTest
      tags: [simulation]
      summary: Run self red-team test
      responses:
        "200":
          description: Self-test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfTestResult"

  /simulate:
    post:
      operationId: runSimulation
      tags: [simulation]
      summary: Run full self-healing simulation
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"

  /voice/transcribe:
    post:
      operationId: transcribeVoice
      tags: [voice]
      summary: Transcribe an audio command without storing the audio
      requestBody:
        required: true
        content:
          audio/wav:
            schema:
              type: string
              format: binary
          audio/webm:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
          audio/mpeg:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Transcribed voice input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceTranscription"
        "400":
          description: Audio payload is missing
        "415":
          description: Unsupported audio format
        "502":
          description: Transcription provider unavailable

  /voice/commands/preview:
    post:
      operationId: previewVoiceCommand
      tags: [voice]
      summary: Parse an allowlisted SOC voice command and return its safe execution plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewVoiceCommandBody"
      responses:
        "200":
          description: Safe command preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCommandPlan"
        "400":
          description: Unsupported or invalid command

  /voice/commands/execute:
    post:
      operationId: executeVoiceCommand
      tags: [voice]
      summary: Execute a confirmed allowlisted SOC voice command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteVoiceCommandBody"
      responses:
        "200":
          description: Safe command result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceCommandExecution"
        "400":
          description: Unsupported, invalid, or unconfirmed command

  /patches:
    get:
      operationId: listPatches
      tags: [events]
      summary: List all auto-applied patches
      responses:
        "200":
          description: List of patches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patch"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /threat-graph:
    get:
      operationId: getThreatGraph
      tags: [dashboard]
      summary: Get threat graph
      responses:
        "200":
          description: Threat graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatGraph"

  /system-metrics:
    get:
      operationId: getSystemMetrics
      tags: [dashboard]
      summary: Get real-time server system metrics
      responses:
        "200":
          description: System metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetrics"

  /mitre-stats:
    get:
      operationId: getMitreStats
      tags: [dashboard]
      summary: Get MITRE ATT&CK tactic breakdown
      responses:
        "200":
          description: MITRE stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MitreStat"

  /risk-timeline:
    get:
      operationId: getRiskTimeline
      tags: [dashboard]
      summary: Get risk score over time (last 24h)
      responses:
        "200":
          description: Risk timeline
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskTimelinePoint"

  /queue-stats:
    get:
      operationId: getQueueStats
      tags: [dashboard]
      summary: Get ingest queue statistics
      responses:
        "200":
          description: Queue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueStats"

  # ─── META-CUBE RUNTIME ─────────────────────────────────────────────────────
  /meta-cube/health:
    get:
      operationId: getMetaCubeHealth
      tags: [runtime]
      summary: Get META-CUBE execution service health
      responses:
        "200":
          description: META-CUBE health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeHealth"
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions:
    get:
      operationId: listMetaCubeExecutions
      tags: [runtime]
      summary: List META-CUBE executions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed, retrying, dead_letter, recovered]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: META-CUBE executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetaCubeExecution"
        "503":
          description: META-CUBE unavailable
    post:
      operationId: createMetaCubeExecution
      tags: [runtime]
      summary: Submit a META-CUBE execution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetaCubeExecutionInput"
      responses:
        "202":
          description: Execution accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "400":
          description: Invalid execution
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions/{id}:
    get:
      operationId: getMetaCubeExecution
      tags: [runtime]
      summary: Get a META-CUBE execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: META-CUBE execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "404":
          description: Execution not found
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions/{id}/retry:
    post:
      operationId: retryMetaCubeExecution
      tags: [runtime]
      summary: Retry a failed META-CUBE execution
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "404":
          description: Execution not found
        "409":
          description: Execution cannot be retried
        "503":
          description: META-CUBE unavailable

  /meta-cube/executions/{id}/recover:
    post:
      operationId: recoverMetaCubeExecution
      tags: [runtime]
      summary: Recover a META-CUBE execution from its checkpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Recovery accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaCubeExecution"
        "404":
          description: Execution not found
        "409":
          description: Execution has no recoverable checkpoint
        "503":
          description: META-CUBE unavailable

  /meta-cube/dlq:
    get:
      operationId: listMetaCubeDlq
      tags: [runtime]
      summary: List META-CUBE dead-letter executions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Dead-letter executions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetaCubeExecution"
        "503":
          description: META-CUBE unavailable

  /meta-cube/checkpoints:
    get:
      operationId: listMetaCubeCheckpoints
      tags: [runtime]
      summary: List META-CUBE checkpoints
      parameters:
        - name: executionId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Runtime checkpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MetaCubeCheckpoint"
        "503":
          description: META-CUBE unavailable

  # ─── TENANTS ──────────────────────────────────────────────────────────────
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantBody"
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── RULES ────────────────────────────────────────────────────────────────
  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List detection rules
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
    post:
      operationId: createRule
      tags: [rules]
      summary: Create a new detection rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRuleBody"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"

  /rules/{id}:
    patch:
      operationId: updateRule
      tags: [rules]
      summary: Update a detection rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRuleBody"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"
        "404":
          description: Not found
    delete:
      operationId: deleteRule
      tags: [rules]
      summary: Delete a detection rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /rules/{id}/toggle:
    patch:
      operationId: toggleRule
      tags: [rules]
      summary: Enable or disable a rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleRuleBody"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rule"

  # ─── CORRELATIONS ─────────────────────────────────────────────────────────
  /correlations:
    get:
      operationId: listCorrelations
      tags: [correlations]
      summary: List detected attack chain correlations
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: severity
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of correlations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Correlation"

  /correlations/{id}/resolve:
    patch:
      operationId: resolveCorrelation
      tags: [correlations]
      summary: Mark a correlation as resolved
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved correlation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Correlation"
        "404":
          description: Not found

  # ─── VIRUS INTELLIGENCE DATABASE ───────────────────────────────────────────
  /virus-db/stats:
    get:
      operationId: getVirusDatabaseStats
      tags: [virus-database]
      summary: Get virus catalog and quarantine vault statistics
      responses:
        "200":
          description: Virus database statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirusDatabaseStats"

  /virus-db/entries:
    get:
      operationId: listVirusEntries
      tags: [virus-database]
      summary: List virus catalog entries
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH, CRITICAL]
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, REVOKED, SUPERSEDED]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Virus catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirusCatalogEntry"
    post:
      operationId: createVirusEntry
      tags: [virus-database]
      summary: Add a verified SHA-256 indicator to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirusEntryInput"
      responses:
        "201":
          description: Created virus entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirusCatalogEntry"
        "400":
          description: Invalid catalog entry
        "409":
          description: Indicator already exists

  /virus-db/entries/{id}:
    get:
      operationId: getVirusEntry
      tags: [virus-database]
      summary: Get one virus catalog entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Virus catalog entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirusCatalogEntry"
        "404":
          description: Not found

  /virus-db/indicators/lookup:
    post:
      operationId: lookupVirusIndicator
      tags: [virus-database]
      summary: Look up an exact SHA-256 indicator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirusLookupInput"
      responses:
        "200":
          description: Indicator lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirusLookupResult"
        "400":
          description: Invalid SHA-256

  /virus-db/samples:
    get:
      operationId: listVirusSamples
      tags: [virus-database]
      summary: List private sample metadata without binary content
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [UPLOADING, QUARANTINED, HASH_VERIFIED, REJECTED, TOMBSTONED]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Sample metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirusSample"

  /virus-db/samples/intake:
    post:
      operationId: registerVirusSample
      tags: [virus-database]
      summary: Register quarantined sample metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirusSampleInput"
      responses:
        "201":
          description: Registered sample metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirusSample"
        "400":
          description: Invalid or oversized sample metadata
        "409":
          description: Sample hash already registered

  /virus-db/samples/{id}/download-request:
    post:
      operationId: requestVirusSampleDownload
      tags: [virus-database]
      summary: Request authorized private sample access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirusSampleAccessInput"
      responses:
        "403":
          description: Binary access remains disabled until authorization is configured

  /virus-db/feeds:
    get:
      operationId: listVirusFeeds
      tags: [virus-database]
      summary: List approved threat-intelligence feed sources
      responses:
        "200":
          description: Feed sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirusFeedSource"
    post:
      operationId: createVirusFeed
      tags: [virus-database]
      summary: Register an approved feed source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirusFeedInput"
      responses:
        "201":
          description: Created feed source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirusFeedSource"
        "400":
          description: Invalid feed source

  /virus-db/feeds/{id}/sync:
    post:
      operationId: syncVirusFeed
      tags: [virus-database]
      summary: Record an idempotent manual feed import
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirusFeedSyncInput"
      responses:
        "201":
          description: Feed import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirusFeedImport"
        "404":
          description: Feed source not found
        "409":
          description: Feed version already imported

  /virus-db/matches:
    get:
      operationId: listVirusMatches
      tags: [virus-database]
      summary: List virus matches linked to SOC evidence
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Virus matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirusMatch"

  /virus-db/audit:
    get:
      operationId: listVirusDatabaseAudit
      tags: [virus-database]
      summary: List append-only virus database audit events
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Virus database audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirusDatabaseAudit"

components:
  schemas:
    ApiError:
      type: object
      required: [error, code]
      properties: { error: { type: string }, code: { type: string }, decisionId: { type: string } }
    CurrentPrincipal:
      type: object
      required: [principalId, principalType, tenantIds, roles, capabilities, authMethod, credentialVersion]
      properties:
        principalId: { type: string }
        principalType: { type: string, enum: [USER, SERVICE, GATEWAY] }
        tenantIds: { type: array, items: { type: integer } }
        roles: { type: array, items: { type: string } }
        capabilities: { type: array, items: { type: string } }
        authMethod: { type: string, enum: [CLERK, SCOPED_CREDENTIAL] }
        credentialVersion: { type: integer }
    AuditRecord:
      type: object
      required: [id, tenantId, sequence, occurredAt, principalId, principalType, action, targetType, targetId, decision, reasonCode, correlationId, prevHash, hash]
      properties:
        id: { type: integer }
        tenantId: { type: integer }
        sequence: { type: integer }
        occurredAt: { type: string, format: date-time }
        principalId: { type: string }
        principalType: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        decision: { type: string }
        reasonCode: { type: string }
        correlationId: { type: string }
        prevHash: { type: string }
        hash: { type: string }
    AuditRecordPage:
      type: object
      required: [records, nextCursor]
      properties: { records: { type: array, items: { $ref: "#/components/schemas/AuditRecord" } }, nextCursor: { type: ["string", "null"] } }
    AuditVerificationInput:
      type: object
      properties: { tenantId: { type: integer }, from: { type: string, format: date-time }, to: { type: string, format: date-time } }
    AuditVerificationResult:
      type: object
      required: [valid, checked, firstBrokenSequence, errorCode]
      properties: { valid: { type: boolean }, checked: { type: integer }, firstBrokenSequence: { type: ["integer", "null"] }, errorCode: { type: ["string", "null"] } }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    TrafficTelemetryInput:
      type: object
      properties:
        tenantId:
          type: integer
          minimum: 1
        gatewayId:
          type: string
          minLength: 1
          maxLength: 120
        observationId:
          type: string
          minLength: 1
          maxLength: 160
        observationType:
          type: string
          enum: [FLOW, HEARTBEAT]
          default: FLOW
        observedAt:
          type: string
          format: date-time
        protocol:
          type: string
          maxLength: 24
          default: UNKNOWN
        direction:
          type: string
          enum: [INBOUND, OUTBOUND, INTERNAL, UNKNOWN]
          default: UNKNOWN
        sourceAsset:
          type: string
          maxLength: 160
        destinationAsset:
          type: string
          maxLength: 160
        sourcePort:
          type: integer
          minimum: 0
          maximum: 65535
        destinationPort:
          type: integer
          minimum: 0
          maximum: 65535
        bytesOut:
          type: integer
          minimum: 0
          maximum: 1073741824
          default: 0
        bytesIn:
          type: integer
          minimum: 0
          maximum: 1073741824
          default: 0
        packets:
          type: integer
          minimum: 0
          maximum: 10000000
          default: 0
        durationMs:
          type: integer
          minimum: 0
          maximum: 86400000
          default: 0
        dnsQueryName:
          type: string
          maxLength: 253
        tlsServerName:
          type: string
          maxLength: 253
        httpHost:
          type: string
          maxLength: 253
        heartbeatStatus:
          type: string
          enum: [HEALTHY, DEGRADED, OFFLINE]
        heartbeatLatencyMs:
          type: integer
          minimum: 0
          maximum: 120000
      required: [gatewayId, observationId, observedAt]

    TrafficObservation:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        gatewayId:
          type: string
        observationId:
          type: string
        observationType:
          type: string
          enum: [FLOW, HEARTBEAT]
        observedAt:
          type: string
          format: date-time
        protocol:
          type: string
        direction:
          type: string
        sourceAsset:
          type: ["string", "null"]
        destinationAsset:
          type: ["string", "null"]
        sourcePort:
          type: ["integer", "null"]
        destinationPort:
          type: ["integer", "null"]
        bytesOut:
          type: integer
        bytesIn:
          type: integer
        packets:
          type: integer
        durationMs:
          type: integer
        dnsQueryName:
          type: ["string", "null"]
        tlsServerName:
          type: ["string", "null"]
        httpHost:
          type: ["string", "null"]
        heartbeatStatus:
          type: ["string", "null"]
        heartbeatLatencyMs:
          type: ["integer", "null"]
        isSynthetic:
          type: boolean
        riskScore:
          type: integer
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        signals:
          type: array
          items:
            type: string
        recommendedAction:
          type: string
          enum: [ALLOW, WARN, ISOLATE]
        analysisVersion:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, tenantId, gatewayId, observationId, observationType, observedAt, protocol, direction, bytesOut, bytesIn, packets, durationMs, isSynthetic, riskScore, severity, signals, recommendedAction, analysisVersion, createdAt]

    TrafficSummary:
      type: object
      properties:
        totalObservations:
          type: integer
        flowCount:
          type: integer
        heartbeatCount:
          type: integer
        highRiskCount:
          type: integer
        isolatedCount:
          type: integer
        warnedCount:
          type: integer
        bytesOut:
          type: integer
        bytesIn:
          type: integer
        protocolBreakdown:
          type: object
          additionalProperties:
            type: integer
        signalBreakdown:
          type: object
          additionalProperties:
            type: integer
        gatewayHealth:
          type: object
          properties:
            total:
              type: integer
            healthy:
              type: integer
            degraded:
              type: integer
            offline:
              type: integer
            lastSeenAt:
              type: ["string", "null"]
              format: date-time
          required: [total, healthy, degraded, offline, lastSeenAt]
        generatedAt:
          type: string
          format: date-time
      required: [totalObservations, flowCount, heartbeatCount, highRiskCount, isolatedCount, warnedCount, bytesOut, bytesIn, protocolBreakdown, signalBreakdown, gatewayHealth, generatedAt]

    ObserverAgentInput:
      type: object
      properties:
        taskType:
          type: string
          enum: [analyze_event, analyze_system, inspect_memory]
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
        event:
          type: string
          maxLength: 10000
        tenantId:
          type: integer
          minimum: 1
      required: [taskType, instruction]

    ObserverAgentRun:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          enum: [blocked, completed, failed]
        input:
          $ref: "#/components/schemas/ObserverAgentInput"
        policy:
          type: object
          additionalProperties: true
        plan:
          type: array
          items:
            type: object
            additionalProperties: true
        results:
          type: array
          items:
            type: object
            additionalProperties: true
        reflection:
          type: object
          additionalProperties: true
        productionChanged:
          type: boolean
          enum: [false]
      required: [runId, status, input, policy, plan, results, reflection, productionChanged]

    HckBiosStatus:
      type: object
      properties:
        name:
          type: string
          enum: [HCK-BIOS]
        modelVersion:
          type: string
          enum: [hck-bios-v1]
        status:
          type: string
          enum: [offline, booting, ready, degraded, failed]
        bootedAt:
          type: ["string", "null"]
          format: date-time
        productionMutationsAllowed:
          type: boolean
          enum: [false]
        executionPlane:
          type: string
          enum: [isolated]
        capabilities:
          type: array
          items:
            type: object
            additionalProperties: true
        topology:
          type: object
          additionalProperties: true
        stages:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [name, modelVersion, status, bootedAt, productionMutationsAllowed, executionPlane, capabilities, topology, stages]

    VoiceTranscription:
      type: object
      properties:
        transcript:
          type: string
        format:
          type: string
          enum: [wav, mp3]
        audioStored:
          type: boolean
          enum: [false]
      required: [transcript, format, audioStored]

    PreviewVoiceCommandBody:
      type: object
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 1000
      required: [transcript]

    ExecuteVoiceCommandBody:
      type: object
      properties:
        transcript:
          type: string
          minLength: 1
          maxLength: 1000
        confirmed:
          type: boolean
          enum: [true]
      required: [transcript, confirmed]

    VoiceCommandCriterion:
      type: object
      properties:
        type:
          type: string
          enum: [SHA256, SAMPLE_ID, FAMILY, SEVERITY, INDICATOR_TYPE]
        value:
          type: ["string", "null"]
      required: [type, value]

    VoiceCommandPlan:
      type: object
      properties:
        intent:
          type: string
          enum: [TEST_VIRUS, SIMULATE_DEFENSE]
        label:
          type: string
        mode:
          type: string
          enum: [TARGETED, MATRIX, SYNTHETIC]
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/VoiceCommandCriterion"
        requiresConfirmation:
          type: boolean
          enum: [true]
        executionAllowed:
          type: boolean
          enum: [false]
        safetyNotes:
          type: array
          items:
            type: string
      required: [intent, label, mode, criteria, requiresConfirmation, executionAllowed, safetyNotes]

    VoiceCriterionResult:
      type: object
      properties:
        type:
          type: string
          enum: [SHA256, SAMPLE_ID, FAMILY, SEVERITY, INDICATOR_TYPE]
        value:
          type: ["string", "null"]
        status:
          type: string
          enum: [MATCH, NO_MATCH, AVAILABLE]
        count:
          type: integer
        evidence:
          type: string
      required: [type, value, status, count, evidence]

    SyntheticDefenseResult:
      type: object
      properties:
        scenario:
          type: string
        riskScore:
          type: integer
        action:
          type: string
          enum: [ALLOW, WARN, ISOLATE]
        response:
          type: string
        stages:
          type: array
          items:
            type: string
            enum: [GENERATED, DETECTED, QUARANTINED, RESPONDED]
      required: [scenario, riskScore, action, response, stages]

    VoiceCommandExecution:
      type: object
      properties:
        intent:
          type: string
          enum: [TEST_VIRUS, SIMULATE_DEFENSE]
        status:
          type: string
          enum: [COMPLETED]
        summary:
          type: string
        recommendedAction:
          type: string
          enum: [ALLOW, WARN, ISOLATE]
        criteriaResults:
          type: array
          items:
            $ref: "#/components/schemas/VoiceCriterionResult"
        syntheticDefense:
          type: array
          items:
            $ref: "#/components/schemas/SyntheticDefenseResult"
        executionAllowed:
          type: boolean
          enum: [false]
        auditRecorded:
          type: boolean
          enum: [true]
      required: [intent, status, summary, recommendedAction, criteriaResults, syntheticDefense, executionAllowed, auditRecorded]

    SecurityEvent:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        event:
          type: string
        score:
          type: integer
        action:
          type: string
          enum: [ALLOW, WARN, ISOLATE, PATCHED]
        status:
          type: string
          enum: [NEW, ACKNOWLEDGED, INVESTIGATING, QUARANTINED, RESOLVED]
        tactic:
          type: ["string", "null"]
        technique:
          type: ["string", "null"]
        techniqueId:
          type: ["string", "null"]
        velocityFlag:
          type: boolean
        correlationId:
          type: ["integer", "null"]
        nodeId:
          type: string
        hash:
          type: string
        prevHash:
          type: string
        timestamp:
          type: string
          format: date-time
        cpuUsage:
          type: ["integer", "null"]
        memUsage:
          type: ["integer", "null"]
      required:
        - id
        - event
        - score
        - action
        - status
        - velocityFlag
        - nodeId
        - hash
        - prevHash
        - timestamp

    EventInput:
      type: object
      properties:
        event:
          type: string
          minLength: 1
        tenantId:
          type: ["integer", "null"]
        cpuUsage:
          type: ["integer", "null"]
        memUsage:
          type: ["integer", "null"]
        managedResourceKey:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$"
        observedManagedState:
          type: object
          additionalProperties: true
      required: [event]

    PipelineResult:
      type: object
      properties:
        event:
          $ref: "#/components/schemas/SecurityEvent"
        rulesMatched:
          type: integer
        scoreBoost:
          type: integer
        correlation:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/Correlation"
            - type: "null"
        pipelineStages:
          type: array
          items:
            type: string
        selfHealing:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/SelfHealingAction"
            - type: "null"
      required: [event, rulesMatched, scoreBoost, pipelineStages]

    SandboxQuarantine:
      type: object
      properties:
        id:
          type: integer
        eventId:
          type: integer
        tenantId:
          type: ["integer", "null"]
        isolationId:
          type: string
        status:
          type: string
          enum: [QUARANTINED, RELEASED, DISCARDED]
        shellType:
          type: string
          enum: [LOGICAL_QUARANTINE]
        reason:
          type: string
        snapshot:
          type: object
          additionalProperties: true
        executionAllowed:
          type: boolean
          enum: [false]
        createdAt:
          type: string
          format: date-time
        releasedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, eventId, isolationId, status, shellType, reason, snapshot, executionAllowed, createdAt]

    ManagedResource:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        resourceKey:
          type: string
        location:
          type: string
          pattern: "^managed://"
        state:
          type: object
          additionalProperties: true
        stateHash:
          type: string
        integrityStatus:
          type: string
          enum: [VERIFIED, QUARANTINED, RESTORING, DEGRADED]
        updatedAt:
          type: string
          format: date-time
      required: [id, resourceKey, location, state, stateHash, integrityStatus, updatedAt]

    RegisterManagedResourceInput:
      type: object
      properties:
        tenantId:
          type: ["integer", "null"]
        resourceKey:
          type: string
          pattern: "^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$"
        location:
          type: string
          pattern: "^managed://[a-zA-Z0-9][a-zA-Z0-9._/-]{0,191}$"
        state:
          type: object
          additionalProperties: true
      required: [resourceKey, location, state]

    RegisterManagedResourceResult:
      type: object
      properties:
        resource:
          $ref: "#/components/schemas/ManagedResource"
        restorePoint:
          $ref: "#/components/schemas/SelfHealingRestorePoint"
      required: [resource, restorePoint]

    SelfHealingRestorePoint:
      type: object
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        resourceKey:
          type: string
        location:
          type: string
        state:
          type: object
          additionalProperties: true
        stateHash:
          type: string
        status:
          type: string
          enum: [VERIFIED, USED, REJECTED]
        source:
          type: string
        createdAt:
          type: string
          format: date-time
        verifiedAt:
          type: string
