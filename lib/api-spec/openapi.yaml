          type: string
          enum: [LOGICAL_QUARANTINE]
        reason:
          type: string
        snapshot:
          type: object
          additionalProperties: true
        executionAllowed:
          type: boolean
          enum: [false]
        createdAt:
          type: string
          format: date-time
        releasedAt:
          type: ["string", "null"]
          format: date-time
      required: [id, eventId, isolationId, status, shellType, reason, snapshot, executionAllowed, createdAt]

    ManagedResource:
      type: object
      properties:
        id:
          type: integer
        tenantId:
