openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: SOC OS - Self-Healing Security Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Security event operations
  - name: simulation
    description: Self-healing simulation
  - name: dashboard
    description: Dashboard and analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List all security events
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: tactic
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of security events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityEvent"
    post:
      operationId: processEvent
      tags: [events]
      summary: Process a security event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Processed event result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get a single security event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Security event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
        "404":
          description: Not found

  /events/{id}/status:
    patch:
      operationId: updateEventStatus
      tags: [events]
      summary: Update alert lifecycle status
      description: Transition an event through NEW → ACKNOWLEDGED → INVESTIGATING → RESOLVED
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventStatusBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
        "404":
          description: Not found

  /self-test:
    post:
      operationId: runSelfTest
      tags: [simulation]
      summary: Run self red-team test
      responses:
        "200":
          description: Self-test results with vulnerabilities and patches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfTestResult"

  /simulate:
    post:
      operationId: runSimulation
      tags: [simulation]
      summary: Run full self-healing simulation
      responses:
        "200":
          description: Full simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"

  /patches:
    get:
      operationId: listPatches
      tags: [events]
      summary: List all auto-applied patches
      responses:
        "200":
          description: List of applied patches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patch"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /threat-graph:
    get:
      operationId: getThreatGraph
      tags: [dashboard]
      summary: Get threat graph
      responses:
        "200":
          description: Threat graph data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatGraph"

  /system-metrics:
    get:
      operationId: getSystemMetrics
      tags: [dashboard]
      summary: Get real-time server system metrics
      description: Returns actual CPU, memory, and load average from the host system
      responses:
        "200":
          description: System metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemMetrics"

  /mitre-stats:
    get:
      operationId: getMitreStats
      tags: [dashboard]
      summary: Get MITRE ATT&CK tactic breakdown
      description: Returns event counts grouped by MITRE ATT&CK tactic
      responses:
        "200":
          description: MITRE stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MitreStat"

  /risk-timeline:
    get:
      operationId: getRiskTimeline
      tags: [dashboard]
      summary: Get risk score over time
      description: Returns avg risk score per hour for the last 24h
      responses:
        "200":
          description: Risk timeline data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskTimelinePoint"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SecurityEvent:
      type: object
      properties:
        id:
          type: integer
        event:
          type: string
        score:
          type: integer
        action:
          type: string
          enum: [ALLOW, WARN, ISOLATE, PATCHED]
        status:
          type: string
          enum: [NEW, ACKNOWLEDGED, INVESTIGATING, RESOLVED]
        tactic:
          type: ["string", "null"]
        technique:
          type: ["string", "null"]
        techniqueId:
          type: ["string", "null"]
        velocityFlag:
          type: boolean
        nodeId:
          type: string
        hash:
          type: string
        prevHash:
          type: string
        timestamp:
          type: string
          format: date-time
        cpuUsage:
          type: ["integer", "null"]
        memUsage:
          type: ["integer", "null"]
      required:
        - id
        - event
        - score
        - action
        - status
        - velocityFlag
        - nodeId
        - hash
        - prevHash
        - timestamp

    EventInput:
      type: object
      properties:
        event:
          type: string
          minLength: 1
        cpuUsage:
          type: ["integer", "null"]
        memUsage:
          type: ["integer", "null"]
      required: [event]

    UpdateEventStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [ACKNOWLEDGED, INVESTIGATING, RESOLVED]
      required: [status]

    Patch:
      type: object
      properties:
        id:
          type: integer
        attack:
          type: string
        fix:
          type: string
        tactic:
          type: ["string", "null"]
        appliedAt:
          type: string
          format: date-time
      required: [id, attack, fix, appliedAt]

    SelfTestResult:
      type: object
      properties:
        vulnerabilities:
          type: array
          items:
            type: object
            properties:
              attack:
                type: string
              score:
                type: integer
              action:
                type: string
              tactic:
                type: ["string", "null"]
              technique:
                type: ["string", "null"]
              fix:
                type: ["string", "null"]
            required: [attack, score, action]
        patchesApplied:
          type: integer
        systemStatus:
          type: string
      required: [vulnerabilities, patchesApplied, systemStatus]

    SimulationResult:
      type: object
      properties:
        baseEvent:
          $ref: "#/components/schemas/SecurityEvent"
        selfHealingEvents:
          type: array
          items:
            type: object
            properties:
              attack:
                type: string
              tactic:
                type: ["string", "null"]
              fix:
                type: string
            required: [attack, fix]
        totalProcessed:
          type: integer
        patchesApplied:
          type: integer
      required: [baseEvent, selfHealingEvents, totalProcessed, patchesApplied]

    DashboardSummary:
      type: object
      properties:
        totalEvents:
          type: integer
        totalPatches:
          type: integer
        openAlerts:
          type: integer
        resolvedAlerts:
          type: integer
        actionCounts:
          type: object
          properties:
            ALLOW:
              type: integer
            WARN:
              type: integer
            ISOLATE:
              type: integer
            PATCHED:
              type: integer
          required: [ALLOW, WARN, ISOLATE, PATCHED]
        statusCounts:
          type: object
          properties:
            NEW:
              type: integer
            ACKNOWLEDGED:
              type: integer
            INVESTIGATING:
              type: integer
            RESOLVED:
              type: integer
          required: [NEW, ACKNOWLEDGED, INVESTIGATING, RESOLVED]
        systemStatus:
          type: string
          enum: [SECURE, MONITORING, ALERT, CRITICAL]
        avgRiskScore:
          type: number
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEvent"
        threatLevel:
          type: integer
        topTactics:
          type: array
          items:
            type: object
            properties:
              tactic:
                type: string
              count:
                type: integer
            required: [tactic, count]
      required:
        - totalEvents
        - totalPatches
        - openAlerts
        - resolvedAlerts
        - actionCounts
        - statusCounts
        - systemStatus
        - avgRiskScore
        - recentEvents
        - threatLevel
        - topTactics

    ThreatNode:
      type: object
      properties:
        id:
          type: string
        event:
          type: string
        score:
          type: integer
        action:
          type: string
        tactic:
          type: ["string", "null"]
        status:
          type: string
        timestamp:
          type: string
          format: date-time
      required: [id, event, score, action, status, timestamp]

    ThreatGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/ThreatNode"
        edges:
          type: array
          items:
            type: array
            items:
              type: string
            minItems: 2
            maxItems: 2
      required: [nodes, edges]

    SystemMetrics:
      type: object
      properties:
        cpuPercent:
          type: number
        memPercent:
          type: number
        memUsedMb:
          type: number
        memTotalMb:
          type: number
        loadAvg1m:
          type: number
        loadAvg5m:
          type: number
        loadAvg15m:
          type: number
        uptimeSeconds:
          type: number
      required:
        - cpuPercent
        - memPercent
        - memUsedMb
        - memTotalMb
        - loadAvg1m
        - loadAvg5m
        - loadAvg15m
        - uptimeSeconds

    MitreStat:
      type: object
      properties:
        tactic:
          type: string
        count:
          type: integer
        avgScore:
          type: number
      required: [tactic, count, avgScore]

    RiskTimelinePoint:
      type: object
      properties:
        hour:
          type: string
          format: date-time
        avgScore:
          type: number
        count:
          type: integer
      required: [hour, avgScore, count]
